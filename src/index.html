<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>VCCC Management System</title>
  <meta name="description" content="VCCC Management System to manage districts, cities, zones, churches, and pastors with full assignment tracking.">
  <meta name="keywords" content="VCCC, VCCC Management, Church Management System, Pastors Management, VCCCManagement, VCCCManagement.netlify.app">
  <meta property="og:title" content="VCCC Management System">
  <meta property="og:description" content="VCCC Management System to manage districts, cities, zones, churches, and pastors with full assignment tracking.">
  <meta property="og:url" content="https://vcccmanagement.netlify.app/">
  <meta property="og:type" content="website">
  <meta name="robots" content="index, follow">


  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: {
        preflight: false, // Disables Tailwind's CSS reset to preserve existing custom styles
      },
      theme: {
        extend: {
          colors: {
            primary: '#4f46e5',
            secondary: '#10b981'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css?v=4">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1/build/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2/html5-qrcode.min.js"></script>
</head>
<body>
<div id="startup-loader" style="position: fixed; inset: 0; background: var(--bg-base, #ffffff); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s;">
  <div style="width: 48px; height: 48px; border: 4px solid var(--accent, #4f46e5); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
  <div style="margin-top: 20px; font-weight: 700; color: var(--text-primary, #1e293b);">Loading...</div>
</div>
<div class="app-layout">
  <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <i data-lucide="church" style="width:22px;height:22px;color:#fff"></i>
      </div>
      <div class="logo-text">
        <strong>ChurchMS</strong>
        <span>Management System</span>
      </div>
      <button class="btn btn-icon-sm btn-secondary sidebar-close-btn" onclick="toggleSidebar()">
        <i data-lucide="x"></i>
      </button>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <div class="nav-item active" data-page="dashboard">
        <span class="nav-icon"><i data-lucide="layout-dashboard"></i></span>
        <span class="nav-text">Dashboard</span>
      </div>
      <div class="nav-item" data-page="pastors">
        <span class="nav-icon"><i data-lucide="users"></i></span>
        <span class="nav-text">Pastors</span>
      </div>
      <div class="nav-item" data-page="assignments">
        <span class="nav-icon"><i data-lucide="clipboard-list"></i></span>
        <span class="nav-text">Assignments</span>
      </div>
      <div class="nav-section-label">Organization</div>
      <div class="nav-item" data-page="districts">
        <span class="nav-icon"><i data-lucide="map"></i></span>
        <span class="nav-text">Districts</span>
      </div>
      <div class="nav-item" data-page="churches">
        <span class="nav-icon"><i data-lucide="church"></i></span>
        <span class="nav-text">Churches</span>
      </div>
      <div class="nav-section-label">Events & Delegates</div>
      <div class="nav-item" data-page="conferences">
        <span class="nav-icon"><i data-lucide="calendar"></i></span>
        <span class="nav-text">Conferences</span>
      </div>
      <div class="nav-item" data-page="meals">
        <span class="nav-icon"><i data-lucide="utensils"></i></span>
        <span class="nav-text">Meals Monitor</span>
      </div>
      <div class="nav-item" data-page="disciples">
        <span class="nav-icon"><i data-lucide="user-check"></i></span>
        <span class="nav-text">Disciples</span>
      </div>
      <div class="nav-item" data-page="delegates">
        <span class="nav-icon"><i data-lucide="scan-line"></i></span>
        <span class="nav-text">Delegates & QR</span>
      </div>
      <div class="nav-section-label">Analytics</div>
      <div class="nav-item" data-page="reports">
        <span class="nav-icon"><i data-lucide="bar-chart-2"></i></span>
        <span class="nav-text">Reports</span>
      </div>
      <div class="nav-item" data-page="data">
        <span class="nav-icon"><i data-lucide="database"></i></span>
        <span class="nav-text">Data</span>
      </div>
      <div style="flex-grow:1"></div>
      <div class="nav-item" data-page="help" style="margin-top:auto">
        <span class="nav-icon"><i data-lucide="help-circle"></i></span>
        <span class="nav-text">Help & Guide</span>
      </div>
    </nav>
  </aside>
  <div class="main-content">
    <header class="topbar">
      <button id="menu-toggle" class="btn btn-icon btn-secondary" style="display:none" onclick="toggleSidebar()">
        <i data-lucide="menu"></i>
      </button>
      <div>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <main class="page-content" id="page-content">
    </main>
    <div class="fab-container">
      <button id="mobile-fab" class="btn btn-primary fab-btn" onclick="handleFabClick()">
        <i data-lucide="plus"></i>
      </button>
    </div>
    <nav class="bottom-nav">
      <div class="b-nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
        <i data-lucide="layout-dashboard"></i>
        <span>Home</span>
      </div>
      <div class="b-nav-item" data-page="pastors" onclick="navigate('pastors')">
        <i data-lucide="users"></i>
        <span>Pastors</span>
      </div>
      <div class="b-nav-item" data-page="districts" onclick="navigate('districts')">
        <i data-lucide="map"></i>
        <span>Districts</span>
      </div>
      <div class="b-nav-item" data-page="churches" onclick="navigate('churches')">
        <i data-lucide="church"></i>
        <span>Churches</span>
      </div>
      <div class="b-nav-item" onclick="toggleSidebar()">
        <i data-lucide="menu"></i>
        <span>More</span>
      </div>
    </nav>
  </div>
</div>
<div class="toast-container" id="toast-container"></div>
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
